<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TP4 - Gestion des commandes</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="container py-5">
      <h1 class="mb-4">Gestion des commandes</h1>

      <div class="row row-cols-2 row-cols-md-3 row-cols-lg-5 g-3 mb-4">
        <div class="col">
          <div class="card p-3 h-100">
            <h6>Clients</h6>
            <h2 id="customersCount">-</h2>
          </div>
        </div>

        <div class="col">
          <div class="card p-3 h-100">
            <h6>Produits</h6>
            <h2 id="productsCount">-</h2>
          </div>
        </div>

        <div class="col">
          <div class="card p-3 h-100">
            <h6>Commandes</h6>
            <h2 id="ordersCount">-</h2>
          </div>
        </div>

        <div class="col">
          <div class="card p-3 h-100">
            <h6>Montant cumulé</h6>
            <h2 id="totalAmount">-</h2>
          </div>
        </div>

        <div class="col">
          <div class="card p-3 h-100">
            <h6>Commandes affichées</h6>
            <h2 id="visibleCount">-</h2>
          </div>
        </div>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <input
            type="text"
            id="searchInput"
            class="form-control"
            placeholder="Rechercher par nom du client..."
          />
        </div>

        <div class="col-md-3">
          <select id="statusFilter" class="form-select">
            <option value="all">Tous les statuts</option>
          </select>
        </div>

        <div class="col-md-3">
          <select id="categoryFilter" class="form-select">
            <option value="all">Toutes les catégories</option>
          </select>
        </div>
      </div>

      <div id="errorMessage" class="alert alert-danger d-none"></div>

      <div class="row g-4">
        <div class="col-lg-7">
          <h3 class="mb-3">Commandes</h3>

          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead>
                <tr>
                  <th>N°</th>
                  <th>Client</th>
                  <th>Date</th>
                  <th>Statut</th>
                  <th class="text-end">Total</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="ordersTableBody"></tbody>
            </table>
          </div>
        </div>

        <div class="col-lg-5">
          <div class="card p-4">
            <h3>Détail de la commande</h3>

            <div id="orderDetails"></div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
